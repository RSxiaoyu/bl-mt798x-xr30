name: Build CMCC XR30 Ubootmod Bootloader

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0' # Weekly at 04:00 Beijing time every Monday
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install minimal build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential \
            flex bison libssl-dev device-tree-compiler

      - name: Clone Yuzhii bl-mt798x-dhcpd upstream
        run: |
          git clone --depth 1 https://github.com/Yuzhii0718/bl-mt798x-dhcpd.git upstream
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Bootloader (BL2 + FIP)
        working-directory: upstream
        run: |
          export SOC=mt7981
          export BOARD=cmcc_xr30
          export VERSION=SP2
          export VARIANT=ubootmod
          chmod +x ./build.sh
          ./build.sh

      - name: Organize outputs & generate checksums
        run: |
          mkdir -p release
          cp -v upstream/output/bl2-*.img release/bl2-mt7981-cmcc_xr30-ubootmod.bin
          cp -v upstream/output/fip-*.bin release/fip-mt7981-cmcc_xr30-ubootmod.bin
          cd release
          sha256sum * > sha256sums
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmcc_xr30-ubootmod
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubootmod-${{ env.UPSTREAM_SHA }}-${{ github.run_number }}
          name: "CMCC XR30 Ubootmod Bootloader (${{ env.UPSTREAM_SHA }})"
          body: |
            ## CMCC XR30 Ubootmod 专用 Bootloader

            专为 **中国移动 CMCC XR30 (MT7981B + 512MB DDR4 + 兆易创新 GD5F1GM7 SPI-NAND)** 打造的纯粹 ubootmod 架构 Bootloader。

            - **源码基准**：[Yuzhii0718/bl-mt798x-dhcpd @ ${{ env.UPSTREAM_SHA }}](https://github.com/Yuzhii0718/bl-mt798x-dhcpd/commit/${{ env.UPSTREAM_SHA }}) (ATF SP2 + U-Boot 20250711)
            - **变体架构**：`ubootmod` (彻底废除 NMBM，原生 MTD 直通，环境变量持久化于 UBI 卷)
            - **适配固件**：OpenWrt / [ImmortalWrt 25.12 All-in-FIT 单固件](https://github.com/RSxiaoyu/immortalwrt-xr30)
            - **Web 控制台**：`http://192.168.1.1` (内置 DHCP 服务，直连即用)

            ### 包含文件
            - `bl2-mt7981-cmcc_xr30-ubootmod.bin`：升级 ATF BL2
            - `fip-mt7981-cmcc_xr30-ubootmod.bin`：升级 U-Boot FIP
            - `sha256sums`：文件完整性校验值
          files: release/*
