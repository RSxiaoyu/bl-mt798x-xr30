name: Build CMCC XR30 Ubootmod Bootloader

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential \
            flex bison libssl-dev device-tree-compiler python2.7 nodejs npm

      - name: Clone Yuzhii bl-mt798x-dhcpd upstream
        run: |
          git clone --depth 1 https://github.com/Yuzhii0718/bl-mt798x-dhcpd.git upstream

      - name: Build Bootloader (BL2 + FIP)
        working-directory: upstream
        run: |
          export SOC=mt7981
          export BOARD=cmcc_xr30
          export VERSION=SP2
          export VARIANT=ubootmod
          chmod +x ./build.sh
          ./build.sh

      - name: Organize outputs
        run: |
          mkdir -p release
          cp -v upstream/output/bl2-*.img release/bl2-mt7981-cmcc_xr30-ubootmod.bin
          cp -v upstream/output/fip-*.bin release/fip-mt7981-cmcc_xr30-ubootmod.bin
          ls -lh release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmcc_xr30-ubootmod
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubootmod-${{ github.run_number }}
          name: "CMCC XR30 Ubootmod Bootloader"
          body: |
            ## 🚀 CMCC XR30 Ubootmod 专用 Bootloader

            专为 **中国移动 CMCC XR30 (MT7981B + 512MB DDR4 + 兆易创新 GD5F1GM7 SPI-NAND)** 打造的纯粹 ubootmod 架构 Bootloader。

            - **源码基准**：[Yuzhii0718/bl-mt798x-dhcpd](https://github.com/Yuzhii0718/bl-mt798x-dhcpd) (ATF SP2 + U-Boot 20250711)
            - **变体架构**：`ubootmod` (彻底废除 NMBM，原生 MTD 直通，环境变量持久化于 UBI 卷)
            - **适配固件**：OpenWrt / [ImmortalWrt 25.12 All-in-FIT 单固件](https://github.com/RSxiaoyu/immortalwrt-xr30)
            - **Web 恢复控制台**：`http://192.168.1.1` (内置 DHCP 服务，直连即用)

            ### 包含文件
            - `bl2-mt7981-cmcc_xr30-ubootmod.bin`：升级 ATF BL2
            - `fip-mt7981-cmcc_xr30-ubootmod.bin`：升级 U-Boot FIP
          files: release/*
