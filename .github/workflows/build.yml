name: Build CMCC XR30 Ubootmod Bootloader

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if upstream commit is unchanged'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 20 * * 0' # Weekly at 04:00 Beijing time every Monday
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/Yuzhii0718/bl-mt798x-dhcpd
  UPSTREAM_BRANCH: master

permissions:
  contents: write

jobs:
  check_upstream:
    name: Check Upstream Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_short_sha: ${{ steps.check.outputs.upstream_short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream commit
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote ${{ env.UPSTREAM_REPO }}.git refs/heads/${{ env.UPSTREAM_BRANCH }} | awk '{print $1}')
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "Error: Failed to fetch upstream SHA from git ls-remote!"
            exit 1
          fi
          SHORT_SHA="${UPSTREAM_SHA:0:7}"
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "upstream_short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # 构建条件：强制构建，或该上游 commit 尚无对应 Release（push/schedule 统一走查重）
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Force build requested."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif gh release list --repo "${{ github.repository }}" --json tagName -q ".[].tagName" | grep -q "${SHORT_SHA}"; then
            echo "Release for upstream commit ${SHORT_SHA} already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream commit ${SHORT_SHA} detected. Starting build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Bootloader
    needs: check_upstream
    if: needs.check_upstream.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install minimal build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential \
            flex bison libssl-dev device-tree-compiler

      - name: Clone Yuzhii bl-mt798x-dhcpd upstream
        run: |
          git clone --depth 1 ${{ env.UPSTREAM_REPO }}.git -b ${{ env.UPSTREAM_BRANCH }} upstream

      - name: Build Bootloader (BL2 + FIP)
        working-directory: upstream
        run: |
          export SOC=mt7981
          export BOARD=cmcc_xr30
          export VERSION=SP2
          export VARIANT=ubootmod
          chmod +x ./build.sh
          ./build.sh

      - name: Organize outputs & generate checksums
        run: |
          mkdir -p release
          BL2_FILE=$(find upstream/output -name "bl2-*.img" | head -n 1)
          FIP_FILE=$(find upstream/output -name "fip-*.bin" | head -n 1)
          [ -f "$BL2_FILE" ] && cp -v "$BL2_FILE" release/bl2-mt7981-cmcc_xr30-ubootmod.bin
          [ -f "$FIP_FILE" ] && cp -v "$FIP_FILE" release/fip-mt7981-cmcc_xr30-ubootmod.bin
          cd release
          sha256sum * > sha256sums
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ubootmod-${{ needs.check_upstream.outputs.upstream_short_sha }}
          name: "CMCC XR30 Ubootmod Bootloader (${{ needs.check_upstream.outputs.upstream_short_sha }})"
          body: |
            - **上游**: [Yuzhii0718/bl-mt798x-dhcpd](https://github.com/Yuzhii0718/bl-mt798x-dhcpd) @ `${{ needs.check_upstream.outputs.upstream_sha }}` (master) — 零补丁，环境变量直调 build.sh (SOC=mt7981 BOARD=cmcc_xr30 VARIANT=ubootmod)
            - **ubootmod**: 移除 NMBM，UBI 环境变量，Web 恢复控制台 `http://192.168.1.1`
            - **适配固件**: [immortalwrt-xr30](https://github.com/RSxiaoyu/immortalwrt-xr30) (All-in-FIT 单镜像)
          files: release/*
