name: Build CMCC XR30 Modern Bootloader

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ATF Version'
        required: true
        default: 'SP2'
        type: choice
        options:
          - 'SP2'
          - '2025'
          - 'SP1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: [ubootmod, nonmbm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential \
            flex bison libssl-dev device-tree-compiler python2.7 nodejs npm

      - name: Clone Yuzhii bl-mt798x-dhcpd upstream
        run: |
          git clone --depth 1 https://github.com/Yuzhii0718/bl-mt798x-dhcpd.git upstream

      - name: Build Bootloader (BL2 + FIP)
        working-directory: upstream
        run: |
          VERSION="${{ inputs.version || 'SP2' }}"
          VARIANT="${{ matrix.variant }}"
          chmod +x ./build.sh
          ./build.sh SOC=mt7981 BOARD=cmcc_xr30 VERSION="$VERSION" VARIANT="$VARIANT"

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp -v upstream/output/* artifacts/
          ls -lh artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr30-${{ matrix.variant }}-${{ inputs.version || 'SP2' }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Flatten artifacts for release
        run: |
          mkdir -p release_files
          find all_artifacts/ -type f -exec cp -v {} release_files/ \;
          ls -lh release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "CMCC XR30 Bootloader (SP2 ubootmod & nonmbm)"
          body: |
            ## 🚀 CMCC XR30 Modern Bootloader Release
            
            Built directly from [Yuzhii0718/bl-mt798x-dhcpd](https://github.com/Yuzhii0718/bl-mt798x-dhcpd) upstream with zero redundant modifications.
            
            ### 硬件特性
            - **设备**：中国移动 CMCC XR30
            - **SoC**：MediaTek MT7981B (Filogic 820)
            - **内存配置**：DDR4 512MB
            - **闪存兼容**：全面兼容兆易创新 GigaDevice `GD5F1GM7UExxG` 及其他标准 SPI-NAND
            
            ### 包含固件变体
            1. **`ubootmod` (强烈推荐用于 OpenWrt / ImmortalWrt)**：
               - 禁用 MTK-NMBM 坏块映射，改用 Linux 原生 MTD
               - 环境变量写入 UBI 卷 (`ubootenv` / `ubootenv2`)，彻底解决 `-5` 擦写失败
               - 原生支持 All-in-FIT 单固件与 Web Failsafe 内存直接引导 (`/initramfs.html`)
            2. **`nonmbm`**：
               - 禁用 MTK-NMBM 坏块映射，保持标准 raw MTD 分区布局
            
            ### 内置能力
            - 现代化 Bootstrap Failsafe Web 界面 (`http://192.168.1.1` 或 `http://failsafe.lan`)
            - 内置 DHCP 服务器（网线直连无需手动配置电脑静态 IP）
            - 独立的 `factory` 分区保护
          files: release_files/*
